[project]
name = "ai-coding-training"
version = "0.1.0"
description = "Short, practical AI coding exercises and learning records"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "torch>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
